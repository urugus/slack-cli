name: Update Download Chart

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at UTC 0:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-chart
  cancel-in-progress: false

jobs:
  update-chart:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate download chart
        run: npm run generate:chart

      - name: Publish image to statistics branch
        run: bash scripts/publish-download-chart.sh
