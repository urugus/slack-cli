name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check if npm version already exists
        id: check_npm
        run: node scripts/check-npm-publication.cjs

      - name: Install dependencies
        if: steps.check_npm.outputs.exists == 'false'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check and test
        if: steps.check_npm.outputs.exists == 'false'
        run: |
          npm run check
          npm test -- --run

      - name: Build
        if: steps.check_npm.outputs.exists == 'false'
        run: |
          npm run build
          node --test scripts/runtime-compatibility.cjs

      - name: Publish to npm
        if: steps.check_npm.outputs.exists == 'false'
        run: npm publish --provenance --registry=https://registry.npmjs.org

      - name: Verify published version
        if: steps.check_npm.outputs.exists == 'false'
        run: |
          for attempt in 1 2 3 4 5; do
            if [ "$(npm view '@urugus/slack-cli@${{ steps.version.outputs.version }}' version --registry=https://registry.npmjs.org)" = '${{ steps.version.outputs.version }}' ]; then
              exit 0
            fi
            sleep 5
          done
          echo 'Published version could not be verified' >&2
          exit 1
