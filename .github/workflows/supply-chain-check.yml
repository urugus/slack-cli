name: Supply Chain Security Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  supply-chain-check:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Get base branch package.json
        id: base-pkg
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA":package.json > /tmp/base-package.json

      - name: Run supply chain security check
        id: check
        run: |
          npx --no-install ts-node scripts/supply-chain-check-runner.ts /tmp/base-package.json > /tmp/supply-chain-report.md

      - name: Publish report to job summary
        if: success() || failure()
        run: cat /tmp/supply-chain-report.md >> "$GITHUB_STEP_SUMMARY"
